services:
  db:
    image: "pgvector/pgvector:pg16"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Pas de valeur par defaut : le compose echoue si le mot de passe n'est
      # pas defini dans .env (lui-meme non versionne).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    ports:
      # Bind sur la loopback uniquement : la base n'est pas exposee au reseau local.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
